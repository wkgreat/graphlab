<html>

<head>
    <meta charset="UTF-8">
    <title>graphlab</title>
</head>

<body>
    <div id="describe-div">
        曲线绘制<br>
        <ul>
            <li>绘制模式</li>使用鼠标在屏幕上绘制点<br>
            绘制两个点后会有曲线生成<br>
            鼠标双击退出绘制模式，并进入选择模式<br>
            <li>选择模式</li>使用鼠标单击选中点，选中的点会变成紫色<br>
            在右侧面板的NURBS曲线选项下，可以设置选中点的权重<br>
            双击退出选择模式，重新进入绘制模式
        </ul>

    </div>
    <div id="demo-div">
        <canvas id="demo-canvas" class="demo-canvas"></canvas>
    </div>
    <script type="module" src="./index.ts"></script>
</body>

</html>
